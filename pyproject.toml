[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfgbackup"
version = "1.0.0"
description = "Backup de configuracao de equipamento de rede com normalizacao e deteccao de mudanca gerenciada"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "backup",
    "configuracao",
    "rede",
    "snmp",
    "drift",
    "normalizacao",
    "auditoria",
    "infraestrutura",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
# A unica dependencia de execucao e PyYAML, para ler o inventario de
# equipamentos. O resto e biblioteca padrao: o diff usa difflib, que ja vem
# no Python, e a normalizacao usa re.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
cfgbackup = "cfgbackup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["cfgbackup"]

[tool.coverage.report]
show_missing = true
# O padrao do portfolio e 70%. O piso fica aqui para que uma regressao
# derrube o build em vez de passar despercebida.
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise SystemExit",
    "if TYPE_CHECKING:",
]